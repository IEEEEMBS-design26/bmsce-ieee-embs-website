
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#e879ff" stop-opacity=".4"/>
      <stop offset="65%" stop-color="#941cff" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#941cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sphere">
      <circle cx="430" cy="400" r="340"/>
    </clipPath>
  </defs>

  <circle cx="430" cy="400" r="350" fill="url(#glow)"/>

  <g clip-path="url(#sphere)" fill="none"
     stroke="#bd38ff" filter="url(#neon)">

    <g opacity=".55" stroke-width="1.3">
      <ellipse cx="430" cy="400" rx="335" ry="115"/>
      <ellipse cx="430" cy="400" rx="335" ry="190" transform="rotate(35 430 400)"/>
      <ellipse cx="430" cy="400" rx="335" ry="190" transform="rotate(-35 430 400)"/>
      <ellipse cx="430" cy="400" rx="335" ry="260" transform="rotate(65 430 400)"/>
      <ellipse cx="430" cy="400" rx="335" ry="260" transform="rotate(-65 430 400)"/>
      <ellipse cx="430" cy="400" rx="335" ry="330"/>
      <path d="M90 400 Q250 80 430 60 Q650 90 770 400 Q620 700 430 740 Q200 700 90 400Z"/>
      <path d="M130 270 Q360 360 760 180"/>
      <path d="M110 520 Q400 300 780 590"/>
      <path d="M180 120 Q330 390 650 720"/>
      <path d="M160 680 Q400 400 720 100"/>
    </g>

    <g stroke="#ed65ff" stroke-width="2" opacity=".85">
      <path d="M100 220 L260 300 L390 190 L550 260 L720 150"/>
      <path d="M90 480 L240 390 L370 510 L530 420 L750 540"/>
      <path d="M170 650 L310 520 L460 620 L610 480 L780 350"/>
      <path d="M220 100 L350 250 L470 160 L620 290 L760 220"/>
      <path d="M130 350 L300 420 L450 330 L590 390 L760 300"/>
      <path d="M240 740 L360 620 L500 700 L650 590 L780 650"/>
    </g>

    <g stroke="#f08aff" stroke-width="1.2" opacity=".75">
      <path d="M100 220 L240 390 L390 190 L370 510 L550 260 L610 480"/>
      <path d="M260 300 L450 330 L530 420 L720 150"/>
      <path d="M170 650 L300 420 L460 620 L590 390 L760 540"/>
      <path d="M350 250 L310 520 L620 290 L650 590"/>
      <path d="M130 350 L360 620 L500 700 L760 300"/>
      <path d="M220 100 L450 330 L610 480 L780 650"/>
    </g>

    <g fill="#f4a0ff" stroke="none">
      <circle cx="100" cy="220" r="4"/>
      <circle cx="260" cy="300" r="5"/>
      <circle cx="390" cy="190" r="4"/>
      <circle cx="550" cy="260" r="5"/>
      <circle cx="720" cy="150" r="5"/>
      <circle cx="90" cy="480" r="4"/>
      <circle cx="240" cy="390" r="5"/>
      <circle cx="370" cy="510" r="5"/>
      <circle cx="530" cy="420" r="5"/>
      <circle cx="750" cy="540" r="4"/>
      <circle cx="170" cy="650" r="4"/>
      <circle cx="310" cy="520" r="5"/>
      <circle cx="460" cy="620" r="5"/>
      <circle cx="610" cy="480" r="5"/>
      <circle cx="780" cy="350" r="4"/>
      <circle cx="350" cy="250" r="4"/>
      <circle cx="470" cy="160" r="4"/>
      <circle cx="620" cy="290" r="5"/>
      <circle cx="760" cy="220" r="4"/>
